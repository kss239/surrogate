[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-surrogate-lab"
version = "0.4.0"
description = "Functional workflows for repeated stochastic-simulation surrogate modeling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3", "threadpoolctl>=3.1"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]
parquet = ["pyarrow>=12"]
optimization = ["optuna>=3", "xgboost>=2"]
boosting = ["xgboost>=2", "lightgbm>=4"]
additive = ["pygam>=0.10", "interpret-core>=0.6"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
